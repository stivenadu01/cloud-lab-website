<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Lab Virtual Host</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #071a2d;
            color: #eaf4ff;
        }

        main {
            width: min(620px, 85%);
            padding: 42px;
            border: 1px solid #2563eb;
            border-radius: 18px;
            background: #0f2b46;
            text-align: center;
        }

        h1 { color: #60a5fa; }
        .status { color: #4ade80; font-weight: bold; }
        code {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #061523;
        }
    </style>
</head>
<body>
    <main>
        <h1>Cloud Lab Virtual Host</h1>
        <p class="status">● Virtual host Nginx berhasil berjalan</p>
        <p>Website ini dilayani dari direktori terpisah.</p>
        <code>/var/www/cloud-lab.local</code>
	<p>Deployment source: GitHub → Ubuntu Server → Nginx</p>
    </main>
</body>
</html>
