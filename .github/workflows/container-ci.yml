name: Container CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t cloud-lab-website:ci .

      - name: Run smoke test
        run: |
          docker run -d --name cloud-lab-ci-test -p 8080:80 cloud-lab-website:ci
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8080/ | grep -Fq "Cloud Lab Virtual Host"; then
              exit 0
            fi
            sleep 1
          done

          docker logs cloud-lab-ci-test
          exit 1

      - name: Clean up test container
        if: always()
        run: docker rm -f cloud-lab-ci-test
